components:
  schemas:
    AccountabilityTransactionDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        transaction_number:
          type: string
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        category:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        reference_type:
          type: string
          readOnly: true
        reference_id:
          type: string
          readOnly: true
        reference_number:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CompletionStatusEnum'
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: integer
          nullable: true
          readOnly: true
        source_details:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - created_by_name
      - customer_id
      - customer_name
      - description
      - direction
      - id
      - note
      - payment_method
      - reference_id
      - reference_number
      - reference_type
      - source_details
      - status
      - transaction_number
      - type
    AccountabilityTransactionOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        transaction_number:
          type: string
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        category:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        reference_type:
          type: string
          readOnly: true
        reference_id:
          type: string
          readOnly: true
        reference_number:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CompletionStatusEnum'
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - created_by_name
      - customer_name
      - description
      - direction
      - id
      - note
      - payment_method
      - reference_id
      - reference_number
      - reference_type
      - status
      - transaction_number
      - type
